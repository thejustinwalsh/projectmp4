[package]
name = "projectmp4"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "projectmp4"
path = "src/main.rs"

[lib]
name = "projectmp4"
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde_json = "1"
resvg = { version = "0.49", default-features = false }
cosmic-text = "0.19"
fontdb = { version = "0.23", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Preview window: winit (window + events), glutin (on-screen GL context), cpal (audio out).
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
glutin = { version = "=0.32.3", default-features = false }
cpal = "=0.16.0"
rustfft = "=6.4.1"
deck-track-analysis = { path = "crates/track-analysis" }
deck-media-codec = { path = "crates/media-codec" }

[build-dependencies]
cmake = "0.1"
bindgen = "0.71"

# Beat-this ONNX inference is unusably slow unoptimised (>14 min for one track).
[profile.dev.package."*"]
opt-level = 3

